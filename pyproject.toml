[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "central-securities"
version = "0.1.0"
description = "중앙증권: 한국투자증권(KIS) Open API 게이트웨이와 가상 서브계좌 서버"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "websockets>=13.0",
    "pycryptodome>=3.20",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["central*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
